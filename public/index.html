<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Controle de Gastos</h1>

    <form id="form-gasto">
      <input type="hidden" id="gasto-id" />

      <div class="campo">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" required />
      </div>

      <div class="campo">
        <label for="valor">Valor (R$)</label>
        <input type="number" id="valor" step="0.01" min="0" required />
      </div>

      <div class="campo">
        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" />
      </div>

      <div class="campo">
        <label for="data">Data</label>
        <input type="date" id="data" />
      </div>

      <div class="acoes-form">
        <button type="submit" id="btn-salvar">Adicionar</button>
        <button type="button" id="btn-cancelar" hidden>Cancelar</button>
      </div>
    </form>

    <p id="mensagem" role="status"></p>

    <table>
      <thead>
        <tr>
          <th>Descrição</th>
          <th>Categoria</th>
          <th>Data</th>
          <th>Valor</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="lista-gastos"></tbody>
      <tfoot>
        <tr>
          <td colspan="3">Total</td>
          <td id="total-gastos">R$ 0,00</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </main>

  <script src="app.js"></script>
</body>
</html>
