<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="pagina">
    <header class="cabecalho">
      <div class="marca">
        <span class="logo-mark">R$</span>
        <h1>Controle de Gastos</h1>
      </div>
      <div class="usuario-logado">
        <span class="avatar" id="usuario-avatar"></span>
        <span id="usuario-nome"></span>
        <button type="button" id="btn-sair" class="btn-ghost">Sair</button>
      </div>
    </header>

    <div id="aviso-vencimento" class="aviso" role="alert" hidden></div>

    <section class="cartao resumo">
      <span class="resumo-rotulo">Total de gastos</span>
      <span class="resumo-valor" id="total-gastos">R$ 0,00</span>
    </section>

    <section class="cartao">
      <h2 class="cartao-titulo" id="form-titulo">Novo gasto</h2>

      <form id="form-gasto">
        <input type="hidden" id="gasto-id" />

        <div class="campo campo-larga">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Ex: Mercado" required />
        </div>

        <div class="campo">
          <label for="valor">Valor (R$)</label>
          <input type="number" id="valor" step="0.01" min="0" placeholder="0,00" required />
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <input type="text" id="categoria" placeholder="Ex: Alimentação" />
        </div>

        <div class="campo">
          <label for="data">Data</label>
          <input type="date" id="data" />
        </div>

        <div class="acoes-form">
          <button type="submit" id="btn-salvar" class="btn-primario">Adicionar</button>
          <button type="button" id="btn-cancelar" class="btn-ghost" hidden>Cancelar</button>
        </div>
      </form>

      <p id="mensagem" role="status"></p>
    </section>

    <section class="cartao">
      <h2 class="cartao-titulo">Gastos</h2>
      <ul id="lista-gastos" class="lista-gastos"></ul>
      <p id="estado-vazio" class="estado-vazio" hidden>Nenhum gasto registrado ainda.</p>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
